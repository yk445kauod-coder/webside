<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d4cff">
<title>Offline · WebSide</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;text-align:center;
    background:radial-gradient(900px 500px at 10% 0%,#7c5cff55,transparent),radial-gradient(800px 500px at 100% 100%,#ff6fae44,transparent),#0f0b24}
  .card{max-width:360px}
  .dot{width:72px;height:72px;margin:0 auto 20px;border-radius:22px;background:linear-gradient(135deg,#7c5cff,#4f7cff 55%,#ff6fae);display:grid;place-items:center;font-size:32px}
  h1{margin:0 0 8px;font-size:26px;letter-spacing:-.02em}
  p{margin:0 0 22px;color:#ffffffb0;line-height:1.6}
  button{height:48px;padding:0 26px;border:0;border-radius:16px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,#7c5cff,#4f7cff);cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <div class="dot" aria-hidden="true">📡</div>
  <h1>You're offline</h1>
  <p>No connection right now. Your last saved changes are safe. Reconnect and we'll pick up where you left off.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
