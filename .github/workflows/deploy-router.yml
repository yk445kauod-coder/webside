name: Deploy AI router

on:
  push:
    branches: [master]
    paths: ["workers/ai-router/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy webside-ai-router
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Provider keys already live on the Worker as secrets; a deploy keeps them.
      - run: npx wrangler deploy --config workers/ai-router/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
