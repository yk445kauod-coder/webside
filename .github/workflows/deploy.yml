name: CI / Deploy to Cloudflare

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; a newer push cancels an older run that hasn't deployed yet.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Inlined into the client bundle at build time (public by design).
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy:
    name: Build and deploy
    needs: check
    # Only deploy from the default branch (or when run by hand), never from PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (OpenNext for Cloudflare, bundled for Pages)
        run: |
          npx opennextjs-cloudflare build
          node scripts/build-pages.mjs
      - name: Ensure Pages project and runtime flags
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          cfg='{"compatibility_date":"2026-10-01","compatibility_flags":["nodejs_compat","global_fetch_strictly_public"]}'
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # Create (ignored if it already exists), then always enforce the runtime flags.
          curl -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" \
            -d "{\"name\":\"webside\",\"production_branch\":\"master\"}" | jq '{success,errors}'
          curl -sS -X PATCH "$api/webside" -H "$auth" -H "Content-Type: application/json" \
            -d "{\"deployment_configs\":{\"production\":$cfg,\"preview\":$cfg}}" \
            | tee /tmp/patch.json | jq '{success,errors}'
          jq -e '.success' /tmp/patch.json > /dev/null
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy pages-out --project-name=webside --branch=master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
