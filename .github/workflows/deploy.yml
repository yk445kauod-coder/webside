name: CI / Deploy to Cloudflare

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; a newer push cancels an older run that hasn't deployed yet.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  PAGES_PROJECT: web-side
  D1_NAME: webside-db

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        # Commits made by the publisher only touch sites/**: skip typecheck/lint/test for those.
        run: |
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only HEAD^1 HEAD | grep -qv '^sites/'; then echo "code=true" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event_name }}" = "push" ]; then echo "code=false" >> "$GITHUB_OUTPUT";
          else echo "code=true" >> "$GITHUB_OUTPUT"; fi

  check:
    name: Typecheck, lint, test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy:
    name: Build and deploy
    needs: [changes, check]
    # Only deploy from the default branch (or by hand), never from PRs; site-only commits skip `check`.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (OpenNext for Cloudflare, bundled for Pages)
        run: |
          npx opennextjs-cloudflare build
          node scripts/build-pages.mjs
      - name: Ensure D1 database and schema
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUDO_ADMIN_EMAILS: ${{ secrets.SUDO_ADMIN_EMAILS }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id=$(curl -sS "$api?name=$D1_NAME" -H "$auth" | jq -r '.result[]? | select(.name=="'$D1_NAME'") | .uuid' | head -1)
          if [ -z "$id" ]; then
            id=$(curl -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" -d "{\"name\":\"$D1_NAME\"}" | tee /tmp/d1.json | jq -r '.result.uuid // empty')
          fi
          if [ -z "$id" ]; then echo "Could not find or create the D1 database (does the API token have D1 edit permission?)"; cat /tmp/d1.json; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          printf '{"name":"x","compatibility_date":"2026-10-01","d1_databases":[{"binding":"DB","database_name":"%s","database_id":"%s"}]}' "$D1_NAME" "$id" > /tmp/wd1.jsonc
          npx wrangler d1 execute DB --remote --config /tmp/wd1.jsonc --file db/schema.sql
          if [ -n "$SUDO_ADMIN_EMAILS" ]; then
            list=$(printf '%s' "$SUDO_ADMIN_EMAILS" | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$";"") | ascii_downcase) | map(select(length>0))')
            npx wrangler d1 execute DB --remote --config /tmp/wd1.jsonc --command "UPDATE settings SET value='$(printf '%s' "$list" | sed "s/'/''/g")' WHERE key='sudo_admin_emails'"
          fi
      - name: Ensure Pages project and runtime flags
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ steps.d1.outputs.id }}
          PUBLISH_GH_TOKEN: ${{ secrets.PUBLISH_GH_TOKEN }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          cfg=$(jq -nc --arg id "$D1_ID" --arg tok "$PUBLISH_GH_TOKEN" '{compatibility_date:"2026-10-01",compatibility_flags:["nodejs_compat","global_fetch_strictly_public"],d1_databases:{DB:{id:$id}}} + (if $tok != "" then {env_vars:{GITHUB_PUBLISH_TOKEN:{type:"secret_text",value:$tok}}} else {} end)')
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # Create (ignored if it already exists), then always enforce the runtime flags.
          curl -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" \
            -d "{\"name\":\"$PAGES_PROJECT\",\"production_branch\":\"master\"}" | jq '{success,errors}'
          curl -sS -X PATCH "$api/$PAGES_PROJECT" -H "$auth" -H "Content-Type: application/json" \
            -d "{\"deployment_configs\":{\"production\":$cfg,\"preview\":$cfg}}" \
            | tee /tmp/patch.json | jq '{success,errors}'
          jq -e '.success' /tmp/patch.json > /dev/null
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy pages-out --project-name=$PAGES_PROJECT --branch=master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
